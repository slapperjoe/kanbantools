name: kanban-tools
version: 1.2.0
description: "Kanban Tools — auto-salvage crashed-worker work, auto-reconcile merged worktrees, plus toggleable UI tweaks (wide scrollbars, popout task button)."
author: "Mark R"
provides_hooks:
  - on_kanban_worker_exited
  - kanban_task_completed
config_schema:
  wideScrollbars:
    type: bool
    default: true
    description: "Widen Hermes desktop + webui scrollbars to 16px (matches the desktop/web scrollbar commits)."
  popoutTaskButton:
    type: bool
    default: true
    description: "Add an open-in-new-tab button to the kanban task drawer (desktop + webui)."
  logDownloadButton:
    type: bool
    default: true
    description: "Add a 'download full worker log' button to the kanban task drawer. Served by kanbantools' own plugin endpoint (no core patch needed); falls back to the core raw-log endpoint (local patch 0003) if the plugin route is unavailable."
  autoReconcile:
    type: bool
    default: false
    description: "When a kanban wave ends (last task of a linked wave-group completes done/archived), reconcile the wave's repos: prune wt/t_* worktree branches whose commits are already patch-equivalent in the target branch (untracked scratch archived first). Manual trigger: the Kanban Tools tab 'Run now' button."
  waveEndOnly:
    type: bool
    default: true
    description: "With autoReconcile on: fire only at wave end (all tasks of the linked wave complete). Off = reconcile on every task completion (noisier; useful for single-task boards with no task_links)."
  reconcileRepoRoot:
    type: string
    default: ""
    description: "Repo to reconcile (absolute path). Empty = resolve from the task's worktree recorded in the kanban DB (auto runs), else this must be set for manual runs."
  reconcileTargetBranch:
    type: string
    default: ""
    description: "Branch to triage against. Empty = the repo's current branch (refused when detached). Set explicitly for multi-branch workflows."
