<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Task</title>
<style>
  :root {
    --bg: #0f1117; --panel: #171a23; --panel2: #1d2130;
    --border: #2a2f42; --text: #dbe2f0; --muted: #8b93a7;
    --accent: #5b8cff; --ok: #4ade80; --warn: #fbbf24; --err: #f87171;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }
  .wrap { max-width: 980px; margin: 0 auto; padding: 20px; }

  .topbar { display: flex; align-items: center; gap: 12px; margin-bottom: 16px;
            flex-wrap: wrap; }
  .topbar .crumb { color: var(--muted); font-size: 13px; }
  .topbar .crumb b { color: var(--text); font-weight: 600; }

  .card { background: var(--panel); border: 1px solid var(--border);
          border-radius: 10px; padding: 16px 18px; margin-bottom: 14px; }
  h1 { font-size: 19px; margin: 0 0 4px; word-break: break-word; }
  .task-id { font-family: var(--mono); font-size: 12.5px; color: var(--muted); }

  .badges { display: flex; gap: 8px; flex-wrap: wrap; margin: 10px 0 4px; }
  .badge { font-size: 11.5px; padding: 2px 9px; border-radius: 999px;
           border: 1px solid var(--border); color: var(--muted);
           font-weight: 600; letter-spacing: .02em; }
  .badge.status { color: var(--accent); border-color: #33508a; }
  .badge.assignee { color: #c4a5ff; border-color: #5b3f8f; }
  .badge.board { color: #7fd1ff; border-color: #2c6d96; }

  .body { margin-top: 10px; white-space: pre-wrap; word-break: break-word;
          color: var(--text); font-size: 13.5px; }
  .empty { color: var(--muted); font-style: italic; }

  .section-title { font-size: 12px; text-transform: uppercase; letter-spacing: .08em;
                   color: var(--muted); margin: 18px 0 8px; }
  .meta-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
               gap: 8px 18px; }
  .meta-grid .k { color: var(--muted); font-size: 12px; }
  .meta-grid .v { font-family: var(--mono); font-size: 12.5px; word-break: break-word; }

  table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--border);
           vertical-align: top; }
  th { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .05em; }
  td.run-sum { max-width: 380px; word-break: break-word; }
  code, .mono { font-family: var(--mono); }

  .pill { display: inline-block; font-size: 11px; padding: 1px 8px; border-radius: 999px;
          font-weight: 600; }
  .pill.running { color: var(--warn); border: 1px solid #6b5527; }
  .pill.done { color: var(--ok); border: 1px solid #2f6b45; }
  .pill.blocked { color: var(--err); border: 1px solid #7a3232; }
  .pill.ready, .pill.todo, .pill.triage { color: #7fd1ff; border: 1px solid #2c6d96; }
  .pill.review { color: #c4a5ff; border: 1px solid #5b3f8f; }
  .pill.crashed { color: var(--err); border: 1px solid #7a3232; }

  .comment { border-left: 2px solid var(--border); padding: 6px 12px; margin: 8px 0; }
  .comment .who { font-size: 12px; color: var(--accent); font-weight: 600; }
  .comment .when { font-size: 11px; color: var(--muted); margin-left: 8px; }
  .comment .cbody { margin-top: 3px; white-space: pre-wrap; word-break: break-word; font-size: 13px; }

  .logbox { max-height: 70vh; overflow-y: auto; padding: 12px 14px;
            font-family: var(--mono); font-size: 12px; line-height: 1.55;
            white-space: pre-wrap; word-break: break-word; color: #c6cedc;
            background: #0a0c12; border-radius: 0 0 10px 10px; }
  .logbox::-webkit-scrollbar { width: 10px; }
  .logbox::-webkit-scrollbar-thumb { background: var(--border); border-radius: 5px; }
  .logmeta { font-size: 11px; color: var(--muted); padding: 8px 14px 0; }
  .logempty { color: var(--muted); font-style: italic; padding: 12px 14px; }

  details.collapsed { margin-bottom: 14px; }
  details.collapsed summary { cursor: pointer; color: var(--muted); font-size: 12px;
    text-transform: uppercase; letter-spacing: .08em; padding: 4px 0; user-select: none; }
  details.collapsed summary:hover { color: var(--text); }

  .event { display: flex; gap: 10px; align-items: baseline; padding: 3px 0;
           font-size: 12.5px; }
  .event .when { color: var(--muted); font-family: var(--mono); font-size: 11.5px;
                 white-space: nowrap; }
  .event .kind { color: #7fd1ff; font-family: var(--mono); }
  .event .data { color: var(--muted); font-size: 12px; word-break: break-word; }

  .eventbox { max-height: 220px; overflow-y: auto; padding: 10px 14px; }

  .commentform { display: flex; gap: 8px; align-items: flex-start; margin-top: 12px;
                 padding-top: 10px; border-top: 1px solid var(--border); }
  .commentform textarea { flex: 1; background: var(--panel2); border: 1px solid var(--border);
    border-radius: 8px; color: var(--text); font: 13px/1.4 system-ui, sans-serif;
    padding: 8px 10px; resize: vertical; min-height: 44px; }
  .commentform textarea:focus { outline: none; border-color: var(--accent); }
  .commentform button { background: var(--accent); color: #fff; border: 0;
    border-radius: 8px; padding: 8px 14px; font-weight: 600; cursor: pointer; }
  .commentform button:disabled { opacity: .5; cursor: default; }
  .commentmsg { font-size: 11.5px; color: var(--muted); align-self: center; white-space: nowrap; }

  .diag { border: 1px solid #6b5527; background: #221d0f; border-radius: 8px;
          padding: 10px 12px; margin-bottom: 8px; }
  .diag.error { border-color: #7a3232; background: #261416; }
  .diag .dt { font-weight: 700; margin-bottom: 2px; }
  .diag .dd { color: var(--muted); font-size: 12.5px; white-space: pre-wrap; }

  .errbox { border: 1px solid #7a3232; background: #261416; color: var(--err);
            padding: 12px 14px; border-radius: 8px; }
  .loading { color: var(--muted); }
  .linkrow { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 4px; }
  .chip { font-family: var(--mono); font-size: 11.5px; padding: 1px 8px;
          border: 1px solid var(--border); border-radius: 6px; color: var(--text);
          background: var(--panel2); }
  .chip:hover { border-color: var(--accent); }
</style>
</head>
<body>
<div class="wrap" id="app">
  <div class="topbar">
    <a href="javascript:history.length > 1 ? history.back() : window.close()">← Back</a>
    <span class="crumb" id="crumb">Task</span>
    <span class="crumb" id="boardcrumb"></span>
  </div>
  <div id="content"><div class="loading">Loading…</div></div>
</div>

<script>
(function () {
  "use strict";

  var params = new URLSearchParams(window.location.search);
  var taskId = params.get("task_id") || "";
  var board = params.get("board") || "";

  // The dashboard may be served under a base path (HERMES_BASE_PATH). This
  // page lives at <base>/dashboard-plugins/kanban-tools/dist/task.html —
  // derive the base so API calls resolve correctly.
  var marker = "/dashboard-plugins/";
  var base = "";
  var pidx = window.location.pathname.indexOf(marker);
  if (pidx > 0) base = window.location.pathname.slice(0, pidx);
  else if (window.__HERMES_BASE_PATH__) base = window.__HERMES_BASE_PATH__;

  if (!taskId) {
    document.getElementById("content").innerHTML =
      '<div class="errbox">Missing <code>task_id</code> query parameter.</div>';
    return;
  }

  // ---- auth: mirror the SDK's fetchJSON (session-token header + cookie) ----
  var SESSION_HEADER = "X-Hermes-Session-Token";
  function authedFetch(url, init) {
    var headers = new Headers(init && init.headers);
    var token =
      (window.__HERMES_SESSION_TOKEN__) ||
      params.get("token") ||
      "";
    if (token) headers.set(SESSION_HEADER, token);
    return fetch(url, Object.assign({}, init || {}, { headers: headers, credentials: "include" }));
  }

  function esc(s) {
    return String(s == null ? "" : s)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }

  function timeAgo(ts) {
    if (!ts) return "—";
    var t = typeof ts === "number" ? ts * 1000 : new Date(ts).getTime();
    if (!t) return "—";
    var s = Math.floor((Date.now() - t) / 1000);
    if (s < 60) return s + "s ago";
    if (s < 3600) return Math.floor(s / 60) + "m ago";
    if (s < 86400) return Math.floor(s / 3600) + "h ago";
    return Math.floor(s / 86400) + "d ago";
  }
  function fmtTs(ts) {
    if (!ts) return "—";
    var t = typeof ts === "number" ? ts * 1000 : new Date(ts).getTime();
    return new Date(t).toLocaleString();
  }

  var boardQuery = board ? "&board=" + encodeURIComponent(board) : "";
  var apiUrl = base + "/api/plugins/kanban/tasks/" + encodeURIComponent(taskId) + boardQuery;
  var logUrl = base + "/api/plugins/kanban/tasks/" + encodeURIComponent(taskId) + "/log?tail=150000" + boardQuery;

  document.getElementById("crumb").textContent = taskId;
  document.getElementById("boardcrumb").textContent = board ? ("board: " + board) : "";

  // Load detail + log in parallel. Log is the priority view.
  Promise.all([
    authedFetch(apiUrl).then(checkOk),
    authedFetch(logUrl).then(checkOk),
  ])
    .then(function (res) {
      render(res[0], res[1]);
    })
    .catch(function (e) {
      document.getElementById("content").innerHTML =
        '<div class="errbox">Failed to load task: ' + esc((e && e.message) || e) +
        "</div>";
    });

  function checkOk(r) {
    if (!r.ok) {
      return r.text().then(function (t) {
        throw new Error("HTTP " + r.status + ": " + t.slice(0, 200));
      });
    }
    return r.json();
  }

  function statusPill(status) {
    return '<span class="pill ' + esc(status || "") + '">' + esc(status || "?") + "</span>";
  }

  function render(data, logData) {
    var task = data.task || {};
    var html = "";

    // --- compact header ---
    html += '<div class="card">';
    html += '<h1>' + esc(task.title || "(untitled)") + "</h1>";
    html += '<div class="task-id">' + esc(task.id || taskId) + "</div>";
    html += '<div class="badges">';
    html += '<span class="badge status">' + statusPill(task.status) + "</span>";
    if (task.assignee) html += '<span class="badge assignee">' + esc(task.assignee) + "</span>";
    if (board) html += '<span class="badge board">' + esc(board) + "</span>";
    if (task.priority) html += '<span class="badge">P' + esc(task.priority) + "</span>";
    html += "</div>";
    html += "</div>";

    // --- LOG (priority view) ---
    html += '<div class="section-title" id="log-title">Log</div>';
    html += '<div class="card" style="padding:0">';
    html += '<div id="logbox" class="logbox"></div>';
    html += "</div>";

    // --- details ---
    html += '<details class="collapsed"><summary>Details</summary><div class="card"><div class="meta-grid">';
    html += meta("Created", fmtTs(task.created_at) + " (" + timeAgo(task.created_at) + ")");
    html += meta("Started", fmtTs(task.started_at));
    html += meta("Completed", fmtTs(task.completed_at));
    html += meta("Max retries", task.max_retries);
    html += meta("Workspace", esc(task.workspace_path || "—"));
    html += meta("Branch", esc(task.branch_name || "—"));
    html += meta("Model", esc(task.model_override || "—"));
    html += meta("Provider", esc(task.provider_override || "—"));
    html += "</div></div></details>";

    if (task.body && task.body.trim()) {
      html += '<details class="collapsed"><summary>Description</summary><div class="card"><div class="body">' + esc(task.body) + "</div></div></details>";
    }

    // --- diagnostics ---
    html += '<details class="collapsed"><summary>Diagnostics</summary>';
    if (task.diagnostics && task.diagnostics.length) {
      task.diagnostics.forEach(function (d) {
        html += '<div class="diag' + (d.severity === "error" ? " error" : "") + '">' +
          '<div class="dt">' + esc(d.title || d.kind || "Issue") + "</div>" +
          '<div class="dd">' + esc(d.detail || d.message || "") + "</div>" +
          "</div>";
      });
    } else {
      html += '<div class="card empty">No diagnostics.</div>';
    }
    html += "</details>";

    // --- links (parents / children) ---
    var links = data.links || {};
    if ((links.parents && links.parents.length) || (links.children && links.children.length)) {
      html += '<div class="section-title">Relations</div><div class="card">';
      if (links.parents && links.parents.length) {
        html += '<div class="meta-grid"><div class="k">Parents</div><div class="linkrow">';
        links.parents.forEach(function (p) {
          html += linkChip(p, board);
        });
        html += "</div></div>";
      }
      if (links.children && links.children.length) {
        html += '<div class="meta-grid"><div class="k">Children</div><div class="linkrow">';
        links.children.forEach(function (c) {
          html += linkChip(c, board);
        });
        html += "</div></div>";
      }
      if (data.child_results && data.child_results.length) {
        html += '<table><tr><th>Child</th><th>Status</th><th>Summary</th></tr>';
        data.child_results.forEach(function (cr) {
          html += "<tr><td>" + linkChip(cr.id, board) + "</td><td>" +
            statusPill(cr.status) + "</td><td>" + esc((cr.latest_summary || cr.result || "").slice(0, 120)) +
            "</td></tr>";
        });
        html += "</table>";
      }
      html += "</div>";
    }

    // --- runs ---
    var runs = data.runs || [];
    html += '<div class="section-title">Runs (' + runs.length + ")</div>";
    if (runs.length) {
      html += '<div class="card"><table><tr><th>#</th><th>Status</th><th>Outcome</th><th>Profile</th><th>Started</th><th>Summary / Error</th></tr>';
      runs.forEach(function (r) {
        var label = r.status || "—";
        var pc = (r.outcome && r.outcome.toLowerCase().indexOf("crash") >= 0) ? "crashed"
               : (r.status || "").toLowerCase();
        html += "<tr><td>" + esc(r.id) + "</td>" +
          "<td><span class='pill " + pc + "'>" + esc(label) + "</span></td>" +
          "<td>" + esc(r.outcome || "—") + "</td>" +
          "<td>" + esc(r.profile || "—") + "</td>" +
          "<td>" + fmtTs(r.started_at) + "</td>" +
          "<td class='run-sum'>" + esc((r.summary || r.error || "").slice(0, 220)) + "</td></tr>";
      });
      html += "</table></div>";
    } else {
      html += '<div class="card empty">No runs yet.</div>';
    }

    // --- comments ---
    var comments = data.comments || [];
    html += '<div class="section-title">Comments (' + comments.length + ")</div>";
    html += '<div class="card">';
    if (comments.length) {
      comments.forEach(function (c) {
        html += '<div class="comment"><span class="who">' + esc(c.author || "?") +
          "</span><span class='when'>" + fmtTs(c.created_at) + " (" + timeAgo(c.created_at) + ")</span>" +
          '<div class="cbody">' + esc(c.body) + "</div></div>";
      });
    } else {
      html += '<div class="empty">No comments.</div>';
    }
    // --- add-comment form ---
    html += '<div class="commentform">' +
      '<textarea id="kt-comment-input" rows="2" placeholder="Add a comment\u2026"></textarea>' +
      '<button id="kt-comment-btn" type="button">Post</button>' +
      '<span id="kt-comment-msg" class="commentmsg"></span>' +
      "</div>";
    html += "</div>";

    // --- events (scrollable, most recent 10) ---
    var events = data.events || [];
    html += '<div class="section-title">Events (latest ' + Math.min(events.length, 10) + ' of ' + events.length + ")</div>";
    if (events.length) {
      html += '<div class="card" style="padding:0"><div class="eventbox">';
      // events are appended in chronological order; show the LAST 10.
      events.slice(-10).forEach(function (e) {
        var pd = e.payload || "";
        html += '<div class="event"><span class="when">' + timeAgo(e.created_at) + "</span>" +
          '<span class="kind">' + esc(e.kind) + "</span>" +
          '<span class="data">' + esc(typeof pd === "string" ? pd : JSON.stringify(pd)) + "</span></div>";
      });
      html += "</div></div>";
    } else {
      html += '<div class="card empty">No events.</div>';
    }

    document.getElementById("content").innerHTML = html;

    // ---- wire add-comment form ----
    var cbtn = document.getElementById("kt-comment-btn");
    var cinput = document.getElementById("kt-comment-input");
    var cmsg = document.getElementById("kt-comment-msg");
    if (cbtn && cinput) {
      function postComment() {
        var body = cinput.value.trim();
        if (!body) return;
        cbtn.disabled = true;
        cmsg.textContent = "Posting\u2026";
        authedFetch(base + "/api/plugins/kanban/tasks/" + encodeURIComponent(taskId) + "/comments" + boardQuery, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ body: body, author: "dashboard" }),
        })
          .then(function (r) {
            if (!r.ok) {
              return r.text().then(function (t) { throw new Error("HTTP " + r.status + ": " + t.slice(0, 120)); });
            }
            return r.json();
          })
          .then(function () {
            cinput.value = "";
            cmsg.textContent = "Posted.";
            // Reload detail so the new comment appears.
            authedFetch(apiUrl).then(checkOk).then(function (d) {
              render(d, logData);
            }).catch(function () {});
          })
          .catch(function (e) {
            cmsg.textContent = "Error: " + ((e && e.message) || e);
          })
          .then(function () { cbtn.disabled = false; });
      }
      cbtn.addEventListener("click", postComment);
      cinput.addEventListener("keydown", function (ev) {
        if ((ev.ctrlKey || ev.metaKey) && ev.key === "Enter") postComment();
      });
    }

    // ---- fill the log (priority view) ----
    fillLog(logData);
    startLogRefresh(task.status);
  }

  var refreshTimer = null;

  function fillLog(logData, autoScroll) {
    var box = document.getElementById("logbox");
    var metaEl = document.getElementById("log-title");
    if (!box) return;
    if (!logData || !logData.exists) {
      box.className = "logempty";
      box.textContent = "No worker log yet (task may never have spawned a worker).";
      return;
    }
    var content = logData.content || "";
    if (metaEl) {
      metaEl.textContent = "Log" +
        (logData.truncated ? " (truncated, " + Math.round(logData.size_bytes / 1024) + " KB on disk)" :
         logData.size_bytes > 0 ? " (" + Math.round(logData.size_bytes / 1024) + " KB)" : "");
    }
    if (!content) {
      box.className = "logempty";
      box.textContent = "Log is empty.";
      return;
    }
    var atBottom = autoScroll === undefined
      ? true
      : (box.scrollHeight - box.scrollTop - box.clientHeight) < 40;
    box.className = "logbox";
    box.textContent = content;
    if (atBottom) box.scrollTop = box.scrollHeight;
  }

  // Auto-refresh the log while the task is still active.
  function startLogRefresh(status) {
    if (refreshTimer) { clearInterval(refreshTimer); refreshTimer = null; }
    var active = (status === "running" || status === "ready" || status === "triage");
    if (!active) return;
    refreshTimer = setInterval(function () {
      authedFetch(logUrl)
        .then(checkOk)
        .then(function (lg) {
          fillLog(lg, false); // stay pinned to bottom only if already at bottom
        })
        .catch(function () { /* keep showing the last good log */ });
    }, 10000);
  }

  function meta(k, v) {
    return '<div><div class="k">' + esc(k) + '</div><div class="v">' + v + "</div></div>";
  }

  function linkChip(id, brd) {
    var url = window.location.pathname + "?task_id=" + encodeURIComponent(id) +
      (brd ? "&board=" + encodeURIComponent(brd) : "");
    return '<a class="chip" href="' + url + '">' + esc(id) + "</a>";
  }
})();
</script>
</body>
</html>
