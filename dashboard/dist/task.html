<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Task</title>
<style>
  /* Theme tokens follow the active dashboard theme: theme-bootstrap.js
     (mirroring web/src/themes) writes the active theme's palette, fonts,
     and radius onto :root inline, overriding these defaults — which match
     the built-in `default` (Hermes Teal) theme so the page renders
     correctly even before/without the API. The --color-* values mirror the
     dashboard's shadcn-compat @theme block in web/src/index.css. */
  :root {
    --background: color-mix(in srgb, #041c1c 100%, transparent);
    --background-base: #041c1c;
    --background-alpha: 1;
    --midground: color-mix(in srgb, #ffe6cb 100%, transparent);
    --midground-base: #ffe6cb;
    --midground-alpha: 1;

    --theme-font-sans: system-ui, -apple-system, "Segoe UI", Roboto,
      "Helvetica Neue", Arial, sans-serif;
    --theme-font-mono: ui-monospace, "SF Mono", "Cascadia Mono", Menlo,
      Consolas, monospace;
    --theme-base-size: 15px;
    --theme-line-height: 1.55;
    --theme-letter-spacing: 0;
    --theme-radius: 0.5rem;
    --theme-spacing-mul: 1;

    --color-foreground: var(--midground);
    --color-card: color-mix(in srgb, var(--midground-base) 4%, var(--background-base));
    --color-muted: color-mix(in srgb, var(--midground-base) 8%, var(--background-base));
    /* Dashboard maps this through --color-text-secondary (midground 80%);
       72% reads a touch stronger for this page's small uppercase labels. */
    --color-muted-foreground: color-mix(in srgb, var(--midground-base) 72%, var(--background-base));
    --color-destructive: #fb2c36;
    --color-success: #4ade80;
    --color-warning: #ffbd38;
    --color-border: color-mix(in srgb, var(--midground-base) 15%, transparent);
    --color-input: color-mix(in srgb, var(--midground-base) 15%, transparent);
    --color-ring: var(--midground);

    /* Page-local roles, derived from the theme tokens. */
    --bg: var(--background-base);
    --panel: var(--color-card);
    --panel2: var(--color-muted);
    --border: var(--color-border);
    --border-strong: color-mix(in srgb, var(--midground-base) 35%, transparent);
    --text: var(--color-foreground);
    --muted: var(--color-muted-foreground);
    --accent: var(--midground-base);
    --on-accent: var(--background-base);
    --ok: var(--color-success);
    --warn: var(--color-warning);
    --err: var(--color-destructive);
    /* Semantic TEXT variants: the raw success/warning/destructive hues are
       pastel and wash out on light themes (nous-blue), so in light mode
       theme-bootstrap.js flips [data-theme-mode] and we mix them toward
       black for readable text. Borders/tints keep the raw hues. */
    --ok-text: var(--ok);
    --warn-text: var(--warn);
    --err-text: var(--err);
    --mono: var(--theme-font-mono);
    --radius: var(--theme-radius);
  }
  html[data-theme-mode="light"] {
    --ok-text: color-mix(in srgb, var(--ok) 55%, black);
    --warn-text: color-mix(in srgb, var(--warn) 55%, black);
    --err-text: color-mix(in srgb, var(--err) 55%, black);
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font-family: var(--theme-font-sans);
         font-size: var(--theme-base-size);
         line-height: var(--theme-line-height);
         letter-spacing: var(--theme-letter-spacing); }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }
  .wrap { max-width: 1040px; margin: 0 auto; padding: 20px; }

  .topbar { display: flex; align-items: center; gap: 12px; margin-bottom: 16px;
            flex-wrap: wrap; }
  .topbar .crumb { color: var(--muted); font-size: 13px; }
  .topbar .crumb b { color: var(--text); font-weight: 600; }

  .card { background: var(--panel); border: 1px solid var(--border);
          border-radius: var(--radius); padding: 16px 18px; margin-bottom: 14px; }
  h1 { font-size: 19px; margin: 0 0 4px; word-break: break-word; }
  .task-id { font-family: var(--mono); font-size: 12.5px; color: var(--muted); }

  .badges { display: flex; gap: 8px; flex-wrap: wrap; margin: 10px 0 4px; }
  .badge { font-size: 11.5px; padding: 2px 9px; border-radius: 999px;
           border: 1px solid var(--border-strong); color: var(--muted);
           font-weight: 600; letter-spacing: .02em; }
  .badge.status { color: var(--accent); border-color: color-mix(in srgb, var(--accent) 45%, transparent); }
  .badge.assignee { color: var(--text); }
  .badge.board { color: var(--text); }

  .body { margin-top: 10px; white-space: pre-wrap; word-break: break-word;
          color: var(--text); font-size: 13.5px; }
  .empty { color: var(--muted); font-style: italic; }

  .section-title { font-size: 12px; text-transform: uppercase; letter-spacing: .08em;
                   color: var(--muted); margin: 18px 0 8px; }
  .meta-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
               gap: 8px 18px; }
  .meta-grid .k { color: var(--muted); font-size: 12px; }
  .meta-grid .v { font-family: var(--mono); font-size: 12.5px; word-break: break-word; }

  table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--border);
           vertical-align: top; }
  th { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .05em; }
  td.run-sum { max-width: 380px; word-break: break-word; }
  code, .mono { font-family: var(--mono); }

  .pill { display: inline-block; font-size: 11px; padding: 1px 8px; border-radius: 999px;
          font-weight: 600; background: var(--panel2); }
  .pill.running { color: var(--warn-text); border: 1px solid color-mix(in srgb, var(--warn) 45%, transparent); }
  .pill.done { color: var(--ok-text); border: 1px solid color-mix(in srgb, var(--ok) 45%, transparent); }
  .pill.blocked { color: var(--err-text); border: 1px solid color-mix(in srgb, var(--err) 45%, transparent); }
  .pill.ready, .pill.todo, .pill.triage { color: var(--accent); border: 1px solid color-mix(in srgb, var(--accent) 45%, transparent); }
  .pill.review { color: var(--text); border: 1px solid var(--border-strong); }
  .pill.crashed { color: var(--err-text); border: 1px solid color-mix(in srgb, var(--err) 45%, transparent); }

  .comment { border-left: 2px solid var(--border); padding: 6px 12px; margin: 8px 0; }
  .comment .who { font-size: 12px; color: var(--accent); font-weight: 600; }
  .comment .when { font-size: 11px; color: var(--muted); margin-left: 8px; }
  .comment .cbody { margin-top: 3px; white-space: pre-wrap; word-break: break-word; font-size: 13px; }

  .logbox { max-height: 70vh; overflow-y: auto; padding: 12px 14px;
            font-family: var(--mono); font-size: 12px; line-height: 1.55;
            white-space: pre-wrap; word-break: break-word; color: var(--text);
            background: color-mix(in srgb, var(--panel) 40%, var(--bg));
            border-radius: 0 0 var(--radius) var(--radius); }
  .logbox::-webkit-scrollbar { width: 10px; }
  .logbox::-webkit-scrollbar-thumb { background: var(--border); border-radius: 5px; }
  .logmeta { font-size: 11px; color: var(--muted); padding: 8px 14px 0; }
  .logempty { color: var(--muted); font-style: italic; padding: 12px 14px; }

  details.collapsed { border: 1px solid var(--border); border-radius: var(--radius);
    background: var(--panel); margin-bottom: 14px; overflow: hidden; }
  details.collapsed > summary { cursor: pointer; list-style: none; display: flex;
    align-items: center; gap: 10px; color: var(--text); font-size: 14px; font-weight: 600;
    letter-spacing: .02em; padding: 12px 16px; user-select: none;
    transition: background .12s, color .12s; }
  details.collapsed > summary::-webkit-details-marker { display: none; }
  details.collapsed > summary::before { content: "\25B8"; color: var(--muted);
    font-size: 13px; flex-shrink: 0; transition: transform .15s; }
  details.collapsed[open] > summary::before { transform: rotate(90deg); }
  details.collapsed > summary:hover { background: var(--panel2); }
  details.collapsed > .card { border: 0; background: transparent; border-radius: 0;
    padding: 2px 16px 16px; margin-bottom: 0; }
  details.collapsed > .diag { margin-left: 16px; margin-right: 16px; }
  details.collapsed > .diag:first-of-type { margin-top: 12px; }
  details.collapsed .kt-acc-label { margin-right: auto; }
  details.collapsed .kt-acc-meta { color: var(--muted);
    font-size: 12px; font-weight: 500; font-family: var(--mono); white-space: nowrap; }
  details.collapsed .kt-log-dl { margin-left: 10px; font-size: 12px; font-weight: 600;
    font-family: var(--mono); color: var(--muted); text-decoration: none;
    border: 1px solid var(--border); border-radius: calc(var(--radius) - 2px); padding: 2px 8px;
    background: var(--panel2); white-space: nowrap; }
  details.collapsed .kt-log-dl:hover { color: var(--text); border-color: var(--accent); text-decoration: none; }
  details.collapsed .kt-log-dl[hidden] { display: none; }

  .event { display: flex; gap: 10px; align-items: baseline; padding: 3px 0;
           font-size: 12.5px; }
  .event .when { color: var(--muted); font-family: var(--mono); font-size: 11.5px;
                 white-space: nowrap; }
  .event .kind { color: var(--accent); font-family: var(--mono); }
  .event .data { color: var(--muted); font-size: 12px; word-break: break-word; }

  .eventbox { max-height: 220px; overflow-y: auto; padding: 10px 14px; }

  .commentform { display: flex; gap: 8px; align-items: flex-start; margin-top: 12px;
                 padding-top: 10px; border-top: 1px solid var(--border); }
  .commentform textarea { flex: 1; background: var(--panel2); border: 1px solid var(--border);
    border-radius: calc(var(--radius) - 2px); color: var(--text);
    font-family: var(--theme-font-sans); font-size: 13px; line-height: 1.4;
    padding: 8px 10px; resize: vertical; min-height: 44px; }
  .commentform textarea:focus { outline: none; border-color: var(--accent); }
  .commentform button { background: var(--accent); color: var(--on-accent); border: 0;
    border-radius: calc(var(--radius) - 2px); padding: 8px 14px; font-weight: 600; cursor: pointer; }
  .commentform button:disabled { opacity: .5; cursor: default; }
  .commentmsg { font-size: 11.5px; color: var(--muted); align-self: center; white-space: nowrap; }

  .diag { border: 1px solid color-mix(in srgb, var(--warn) 45%, transparent);
    background: color-mix(in srgb, var(--warn) 8%, var(--bg)); border-radius: calc(var(--radius) - 2px);
    padding: 10px 12px; margin-bottom: 8px; }
  .diag.error { border-color: color-mix(in srgb, var(--err) 45%, transparent);
    background: color-mix(in srgb, var(--err) 8%, var(--bg)); }
  .diag .dt { font-weight: 700; margin-bottom: 2px; }
  .diag .dd { color: var(--muted); font-size: 12.5px; white-space: pre-wrap; }

  .errbox { border: 1px solid color-mix(in srgb, var(--err) 45%, transparent);
    background: color-mix(in srgb, var(--err) 10%, var(--bg)); color: var(--err-text);
    padding: 12px 14px; border-radius: calc(var(--radius) - 2px); }
  .loading { color: var(--muted); }
  .linkrow { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 4px; }
  .chip { font-family: var(--mono); font-size: 11.5px; padding: 1px 8px;
          border: 1px solid var(--border); border-radius: calc(var(--radius) - 2px); color: var(--text);
          background: var(--panel2); }
  .chip:hover { border-color: var(--accent); }

  /* ---- action bar ---- */
  .actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px;
             padding-top: 12px; border-top: 1px solid var(--border); }
  .btn { background: var(--panel2); color: var(--text); border: 1px solid var(--border);
         border-radius: calc(var(--radius) - 2px); padding: 6px 12px; font-size: 12.5px; font-weight: 600;
         cursor: pointer; transition: border-color .12s, background .12s; }
  .btn:hover { border-color: var(--accent); }
  .btn:disabled { opacity: .5; cursor: default; }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
  .btn.primary:hover { filter: brightness(1.1); }
  .btn.danger { border-color: color-mix(in srgb, var(--err) 45%, transparent); color: var(--err-text); }
  .btn.danger:hover { background: color-mix(in srgb, var(--err) 10%, var(--bg)); }
  .btn.ok { border-color: color-mix(in srgb, var(--ok) 45%, transparent); color: var(--ok-text); }
  .btn.ok:hover { background: color-mix(in srgb, var(--ok) 10%, var(--bg)); }
  .btn.warn { border-color: color-mix(in srgb, var(--warn) 45%, transparent); color: var(--warn-text); }
  .btn.warn:hover { background: color-mix(in srgb, var(--warn) 10%, var(--bg)); }

  .actionmsg { font-size: 12px; color: var(--muted); margin-top: 8px; word-break: break-word; }
  .actionmsg.error { color: var(--err-text); }
  .actionmsg.ok { color: var(--ok-text); }

  /* ---- edit form ---- */
  .editgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 16px; }
  @media (max-width: 640px) { .editgrid { grid-template-columns: 1fr; } }
  .field label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 3px; }
  .field input, .field textarea, .field select {
    width: 100%; background: var(--panel2); border: 1px solid var(--border);
    border-radius: calc(var(--radius) - 2px); color: var(--text); padding: 7px 10px;
    font-family: var(--theme-font-sans); font-size: 13px; line-height: 1.4; }
  .field textarea { resize: vertical; min-height: 60px; }
  .field input:focus, .field textarea:focus, .field select:focus { outline: none; border-color: var(--accent); }
  .editrow { display: flex; gap: 8px; align-items: center; margin-top: 12px; flex-wrap: wrap; }

  /* ---- attachments ---- */
  .att-item { display: flex; align-items: center; gap: 10px; padding: 6px 0;
              border-bottom: 1px solid var(--border); font-size: 13px; }
  .att-item:last-child { border-bottom: 0; }
  .att-name { flex: 1; word-break: break-all; }
  .att-meta { color: var(--muted); font-size: 11.5px; font-family: var(--mono); white-space: nowrap; }
  .att-del { background: transparent; border: 0; color: var(--err-text); cursor: pointer; font-size: 14px; }
  .att-up { display: flex; gap: 8px; align-items: center; margin-top: 10px; }
  .att-up input[type=file] { color: var(--muted); font-size: 12px; }

  /* ---- home channels ---- */
  .home-item { display: flex; align-items: center; gap: 10px; padding: 6px 0;
               border-bottom: 1px solid var(--border); font-size: 13px; }
  .home-item:last-child { border-bottom: 0; }
  .home-name { flex: 1; }
  .home-sub { font-size: 11px; padding: 2px 10px; border-radius: 999px; border: 1px solid var(--border);
               cursor: pointer; background: transparent; color: var(--muted); font-weight: 600; }
  .home-sub.on { color: var(--ok-text); border-color: color-mix(in srgb, var(--ok) 45%, transparent); }
  .home-sub:hover { border-color: var(--accent); }
</style>
<!-- Apply the active dashboard theme (palette, fonts, radius) to this page.
     Fails silently if the API is unreachable — the static :root defaults
     above already match the built-in default theme. -->
<script src="theme-bootstrap.js"></script>
</head>
<body>
<div class="wrap" id="app">
  <div class="topbar">
    <a href="javascript:history.length > 1 ? history.back() : window.close()">← Back</a>
    <span class="crumb" id="crumb">Task</span>
    <span class="crumb" id="boardcrumb"></span>
  </div>
  <div id="content"><div class="loading">Loading…</div></div>
</div>

<script>
(function () {
  "use strict";

  var params = new URLSearchParams(window.location.search);
  var taskId = params.get("task_id") || "";
  var board = params.get("board") || "";

  // Base path: this page lives at <base>/dashboard-plugins/kanban-tools/dist/task.html
  var marker = "/dashboard-plugins/";
  var base = "";
  var pidx = window.location.pathname.indexOf(marker);
  if (pidx > 0) base = window.location.pathname.slice(0, pidx);
  else if (window.__HERMES_BASE_PATH__) base = window.__HERMES_BASE_PATH__;

  if (!taskId) {
    document.getElementById("content").innerHTML =
      '<div class="errbox">Missing <code>task_id</code> query parameter.</div>';
    return;
  }

  // ---- auth: mirror the SDK's fetchJSON (session-token header + cookie) ----
  var SESSION_HEADER = "X-Hermes-Session-Token";
  function authedFetch(url, init) {
    var headers = new Headers(init && init.headers);
    var token =
      (window.__HERMES_SESSION_TOKEN__) ||
      params.get("token") ||
      "";
    if (token) headers.set(SESSION_HEADER, token);
    return fetch(url, Object.assign({}, init || {}, { headers: headers, credentials: "include" }));
  }
  function checkOk(r) {
    if (!r.ok) {
      return r.text().then(function (t) {
        var msg = t;
        try { var j = JSON.parse(t); msg = j.detail || t; } catch (e) {}
        throw new Error("HTTP " + r.status + ": " + String(msg).slice(0, 300));
      });
    }
    return r.json();
  }
  function esc(s) {
    return String(s == null ? "" : s)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }
  function timeAgo(ts) {
    if (!ts) return "—";
    var t = typeof ts === "number" ? ts * 1000 : new Date(ts).getTime();
    if (!t) return "—";
    var s = Math.floor((Date.now() - t) / 1000);
    if (s < 60) return s + "s ago";
    if (s < 3600) return Math.floor(s / 60) + "m ago";
    if (s < 86400) return Math.floor(s / 3600) + "h ago";
    return Math.floor(s / 86400) + "d ago";
  }
  function fmtTs(ts) {
    if (!ts) return "—";
    var t = typeof ts === "number" ? ts * 1000 : new Date(ts).getTime();
    return new Date(t).toLocaleString();
  }
  function fmtBytes(n) {
    if (n == null) return "—";
    if (n < 1024) return n + " B";
    if (n < 1048576) return (n / 1024).toFixed(1) + " KB";
    return (n / 1048576).toFixed(1) + " MB";
  }

  var boardQuery = board ? "&board=" + encodeURIComponent(board) : "";
  var apiUrl = base + "/api/plugins/kanban/tasks/" + encodeURIComponent(taskId) + boardQuery;
  var logUrl = base + "/api/plugins/kanban/tasks/" + encodeURIComponent(taskId) + "/log?tail=150000" + boardQuery;
  // Raw log download — a plain <a href> can't set the session header, so pass
  // the token as a query param (the dashboard auth middleware accepts ?token=).
  var sessionToken = window.__HERMES_SESSION_TOKEN__ || params.get("token") || "";
  var rawLogUrl = base + "/api/plugins/kanban/tasks/" + encodeURIComponent(taskId) + "/log?raw=1" +
    boardQuery + (sessionToken ? "&token=" + encodeURIComponent(sessionToken) : "");

  // Current state (loaded + mutated)
  var state = null;
  var logData = null;
  var assignees = [];
  var profiles = [];
  var homeChannels = [];
  var actionMsg = null;      // {text, kind}
  var editMode = false;
  var editDraft = null;
  var refreshTimer = null;
  var openAcc = "details";   // which accordion section is open (exclusive)
  var eventsShown = 10;      // how many events are currently revealed
  var EVENTS_STEP = 10;      // reveal this many more on scroll-to-bottom

  document.getElementById("crumb").textContent = taskId;
  document.getElementById("boardcrumb").textContent = board ? ("board: " + board) : "";

  function loadAll() {
    return Promise.all([
      authedFetch(apiUrl).then(checkOk),
      authedFetch(logUrl).then(checkOk),
      authedFetch(base + "/api/plugins/kanban/assignees" + boardQuery).then(checkOk).catch(function () { return { assignees: [] }; }),
      authedFetch(base + "/api/plugins/kanban/profiles").then(checkOk).catch(function () { return { profiles: [] }; }),
      authedFetch(base + "/api/plugins/kanban/home-channels?task_id=" + encodeURIComponent(taskId) + boardQuery).then(checkOk).catch(function () { return { home_channels: [] }; }),
    ]).then(function (r) {
      state = r[0];
      logData = r[1];
      assignees = (r[2].assignees || []).map(function (a) {
        return typeof a === "string" ? a : (a.name || "");
      }).filter(Boolean);
      profiles = (r[3].profiles || []);
      homeChannels = r[4].home_channels || [];
      render();
      startLogRefresh();
      // Live "written Xs ago" timer for the log header.
      setInterval(updateLogAge, 1000);
    });
  }

  loadAll().catch(function (e) {
    document.getElementById("content").innerHTML =
      '<div class="errbox">Failed to load task: ' + esc((e && e.message) || e) + "</div>";
  });

  function statusPill(status) {
    return '<span class="pill ' + esc(status || "") + '">' + esc(status || "?") + "</span>";
  }

  // ---- action helpers ----
  function patch(payload) {
    return authedFetch(apiUrl, {
      method: "PATCH",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload),
    }).then(checkOk);
  }
  function post(path, payload) {
    return authedFetch(base + "/api/plugins/kanban" + path, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload || {}),
    }).then(checkOk);
  }
  function del(path) {
    return authedFetch(base + "/api/plugins/kanban" + path, { method: "DELETE" }).then(checkOk);
  }
  function setMsg(text, kind) {
    actionMsg = { text: text, kind: kind || "" };
    render();
  }
  function reload() {
    return Promise.all([
      authedFetch(apiUrl).then(checkOk),
      authedFetch(base + "/api/plugins/kanban/home-channels?task_id=" + encodeURIComponent(taskId) + boardQuery).then(checkOk).catch(function () { return { home_channels: homeChannels }; }),
    ]).then(function (r) {
      state = r[0];
      homeChannels = r[1].home_channels || homeChannels;
      editMode = false;
      actionMsg = null;
      render();
      startLogRefresh();
    });
  }

  function doStatus(newStatus, extra) {
    var payload = { status: newStatus };
    Object.keys(extra || {}).forEach(function (k) { payload[k] = extra[k]; });
    patch(payload)
      .then(function () { setMsg("Moved to " + newStatus + ".", "ok"); return reload(); })
      .catch(function (e) { setMsg(String((e && e.message) || e), "error"); });
  }

  function promptBlock() {
    var reason = window.prompt("Block reason:", "");
    if (reason === null) return;
    doStatus("blocked", { block_reason: reason });
  }
  function promptComplete() {

  // ---- edit ----
  function startEdit() {
    var t = state.task || {};
    editDraft = {
      title: t.title || "",
      body: t.body || "",
      priority: t.priority != null ? String(t.priority) : "0",
      assignee: t.assignee || "",
      model_override: t.model_override || "",
      provider_override: t.provider_override || "",
    };
    editMode = true;
    actionMsg = null;
    render();
    renderEditForm();

  function cancelEdit() { editMode = false; actionMsg = null; render(); }
  function saveEdit() {
    var d = editDraft;
    var payload = {};
    if (d.title !== (state.task.title || "")) payload.title = d.title;
    if (d.body !== (state.task.body || "")) payload.body = d.body;
    if (String(d.priority) !== String(state.task.priority != null ? state.task.priority : "0")) payload.priority = parseInt(d.priority, 10) || 0;
    if (d.assignee !== (state.task.assignee || "")) payload.assignee = d.assignee || "";
    if (d.model_override !== (state.task.model_override || "")) payload.model_override = d.model_override || null;
    if (d.provider_override !== (state.task.provider_override || "")) payload.provider_override = d.provider_override || null;
    if (!Object.keys(payload).length) { cancelEdit(); return; }
    patch(payload)
      .then(function () { setMsg("Saved.", "ok"); return reload(); })
      .catch(function (e) { setMsg(String((e && e.message) || e), "error"); });
  }

  // ---- log ----
  var lastLogMtime = null;   // epoch seconds of last write, from logData.mtime

  function updateLogAge() {
    var el = document.getElementById("log-age");
    if (!el) return;
    if (!lastLogMtime) { el.textContent = ""; return; }
    el.textContent = "written " + timeAgo(lastLogMtime);
  }

  function fillLog(autoScroll) {
    var box = document.getElementById("logbox");
    var metaEl = document.getElementById("log-title");
    var dlEl = document.querySelector(".kt-log-dl");
    var ageEl = document.getElementById("log-age");
    if (!box) return;
    if (!logData || !logData.exists) {
      box.className = "logempty";
      box.textContent = "No worker log yet (task may never have spawned a worker).";
      lastLogMtime = null;
      if (dlEl) dlEl.hidden = true;
      if (ageEl) ageEl.textContent = "";
      return;
    }
    if (dlEl) dlEl.hidden = false;
    lastLogMtime = logData.mtime || null;
    var content = logData.content || "";
    if (metaEl) {
      metaEl.textContent = logData.truncated
        ? "(truncated, " + Math.round(logData.size_bytes / 1024) + " KB on disk)"
        : (logData.size_bytes > 0 ? "(" + Math.round(logData.size_bytes / 1024) + " KB)" : "");
    }
    updateLogAge();
    if (!content) {
      box.className = "logempty";
      box.textContent = "Log is empty.";
      return;
    }
    var atBottom = autoScroll === undefined ? true : (box.scrollHeight - box.scrollTop - box.clientHeight) < 40;
    box.className = "logbox";
    box.textContent = content;
    if (atBottom) box.scrollTop = box.scrollHeight;
  }
  function startLogRefresh() {
    if (refreshTimer) { clearInterval(refreshTimer); refreshTimer = null; }
    if (!state || !state.task) return;
    var status = state.task.status;
    var active = (status === "running" || status === "ready" || status === "triage");
    if (!active) return;
    refreshTimer = setInterval(function () {
      authedFetch(logUrl).then(checkOk).then(function (lg) { logData = lg; fillLog(false); })
        .catch(function () {});
    }, 10000);
  }

  function accOpen(id) {
    return (openAcc === id) ? " open" : "";
  }

  function bindAccordions() {
    document.querySelectorAll("details.collapsed").forEach(function (d) {
      d.addEventListener("toggle", function () {
        if (d.open) {
          openAcc = d.getAttribute("data-kt-acc");
          // Exclusive: close every other accordion section.
          document.querySelectorAll("details.collapsed[open]").forEach(function (o) {
            if (o !== d) o.open = false;
          });
        } else if (openAcc === d.getAttribute("data-kt-acc")) {
          // User collapsed the open section — keep it collapsed across re-renders.
          openAcc = null;
        }
      });
    });
  }

  // ---- events (newest first, progressive reveal) ----

  function eventRow(e) {
    var pd = e.payload || "";
    return '<div class="event"><span class="when">' + timeAgo(e.created_at) + "</span>" +
      '<span class="kind">' + esc(e.kind) + "</span>" +
      '<span class="data">' + esc(typeof pd === "string" ? pd : JSON.stringify(pd)) + "</span></div>";
  }

  function renderEvents() {
    var box = document.getElementById("events-box");
    if (!box) return;
    var events = state.events || [];
    var shown = Math.min(eventsShown, events.length);
    fillEventsBox(box, events, shown);
    // Auto-fill: if the initial batch doesn't overflow the box there's no
    // scrollbar to trigger lazy-load, so reveal more until it scrolls (or all
    // events are shown). Keep eventsShown in sync for the header + scroll step.
    while (shown < events.length && box.scrollHeight <= box.clientHeight) {
      shown = Math.min(events.length, shown + EVENTS_STEP);
      fillEventsBox(box, events, shown);
    }
    eventsShown = shown;
    var title = document.getElementById("events-title");
    if (title) title.textContent = "Events (" + shown + " shown of " + events.length + ")";
  }

  function fillEventsBox(box, events, shown) {
    // Newest first: walk the array from the end.
    var html = "";
    for (var i = events.length - 1; i >= 0 && i >= events.length - shown; i--) {
      html += eventRow(events[i]);
    }
    box.innerHTML = html;
  }

  function bindEventsScroll() {
    var box = document.getElementById("events-box");
    if (!box) return;
    box.onscroll = function () {
      var events = state.events || [];
      if (eventsShown >= events.length) return;
      // Near bottom (within 30px): reveal another page. New rows are appended
      // at the BOTTOM (older events), so just keep the user's scroll offset —
      // they scroll down further to reach the newly revealed rows.
      if (box.scrollTop + box.clientHeight >= box.scrollHeight - 30) {
        eventsShown = Math.min(events.length, eventsShown + EVENTS_STEP);
        var prevTop = box.scrollTop;
        renderEvents();
        box.scrollTop = prevTop;
      }
    };
  }

  // ---- render ----
  function actionButtons(task) {
    var st = task.status;
    var btns = [];
    if (st === "triage") {
      btns.push(['<button class="btn primary" id="kt-act-specify">Specify</button>']);
      btns.push(['<button class="btn primary" id="kt-act-decompose">Decompose</button>']);
      btns.push(['<button class="btn" id="kt-act-ready">Make ready</button>']);
      btns.push(['<button class="btn" id="kt-act-block">Block</button>']);
    } else if (st === "todo" || st === "ready") {
      btns.push(['<button class="btn primary" id="kt-act-ready">Make ready</button>']);
      btns.push(['<button class="btn warn" id="kt-act-block">Block</button>']);
      btns.push(['<button class="btn" id="kt-act-review">Request review</button>']);
      btns.push(['<button class="btn ok" id="kt-act-complete">Complete</button>']);
    } else if (st === "running") {
      btns.push(['<button class="btn warn" id="kt-act-reclaim">Reclaim worker</button>']);
      btns.push(['<button class="btn warn" id="kt-act-block">Block</button>']);
      btns.push(['<button class="btn ok" id="kt-act-complete">Complete</button>']);
    } else if (st === "blocked" || st === "scheduled") {
      btns.push(['<button class="btn primary" id="kt-act-ready">Unblock → ready</button>']);
      btns.push(['<button class="btn" id="kt-act-review">Request review</button>']);
    } else if (st === "review") {
      btns.push(['<button class="btn primary" id="kt-act-ready">Accept (ready)</button>']);
      btns.push(['<button class="btn ok" id="kt-act-complete">Complete</button>']);
    } else if (st === "done") {
      btns.push(['<button class="btn" id="kt-act-archive">Archive</button>']);
    }
    // always available
    btns.push(['<button class="btn" id="kt-act-edit">Edit</button>']);
    btns.push(['<button class="btn" id="kt-act-reassign">Reassign</button>']);
    btns.push(['<button class="btn" id="kt-act-estimate">Estimate</button>']);
    return btns.map(function (b) { return b[0]; }).join("");
  }

  function render() {
    if (!state) return;
    var task = state.task || {};
    var html = "";

    // --- header + actions ---
    html += '<div class="card">';
    html += '<h1>' + esc(task.title || "(untitled)") + "</h1>";
    html += '<div class="task-id">' + esc(task.id || taskId) + "</div>";
    html += '<div class="badges">';
    html += '<span class="badge status">' + statusPill(task.status) + "</span>";
    if (task.assignee) html += '<span class="badge assignee">' + esc(task.assignee) + "</span>";
    if (board) html += '<span class="badge board">' + esc(board) + "</span>";
    if (task.priority) html += '<span class="badge">P' + esc(task.priority) + "</span>";
    if (task.model_override) html += '<span class="badge">model: ' + esc(task.model_override) + "</span>";
    if (task.consecutive_failures) html += '<span class="badge" style="color:var(--err-text);border-color:color-mix(in srgb, var(--err) 45%, transparent)">' + esc(task.consecutive_failures) + " failures</span>";
    html += "</div>";
    html += '<div class="actions">' + actionButtons(task) + "</div>";
    if (actionMsg) {
      html += '<div class="actionmsg ' + (actionMsg.kind === "error" ? "error" : actionMsg.kind === "ok" ? "ok" : "") + '">' + esc(actionMsg.text) + "</div>";
    }
    html += "</div>";

    // --- edit form (when in edit mode) ---
    if (editMode) {
      var assigneeOpts = '<option value=""></option>' + assignees.map(function (a) {
        return '<option value="' + esc(a) + '">' + esc(a) + "</option>";
      }).join("");
      html += '<div class="card"><div class="section-title">Edit task</div><div class="editgrid">';
      html += '<div class="field" style="grid-column:1/-1"><label>Title</label><input id="kt-edit-title" type="text"></div>';
      html += '<div class="field" style="grid-column:1/-1"><label>Body</label><textarea id="kt-edit-body"></textarea></div>';
      html += '<div class="field"><label>Priority</label><input id="kt-edit-priority" type="number" min="0"></div>';
      html += '<div class="field"><label>Assignee</label><select id="kt-edit-assignee">' + assigneeOpts + "</select></div>";
      html += '<div class="field"><label>Model override</label><input id="kt-edit-model" type="text" placeholder="e.g. qwen3.8-27b"></div>';
      html += '<div class="field"><label>Provider override</label><input id="kt-edit-provider" type="text" placeholder="e.g. lwoody-ninfer"></div>';
      html += "</div>";
      html += '<div class="editrow"><button class="btn primary" id="kt-edit-save">Save</button>' +
        '<button class="btn" id="kt-edit-cancel">Cancel</button></div></div>';

    // --- details ---
    html += '<details class="collapsed" data-kt-acc="details"' + accOpen("details") + '><summary>Details</summary><div class="card"><div class="meta-grid">';

    html += meta("Started", fmtTs(task.started_at));
    html += meta("Completed", fmtTs(task.completed_at));
    html += meta("Max retries", task.max_retries);
    html += meta("Workspace", esc(task.workspace_path || "—"));
    html += meta("Branch", esc(task.branch_name || "—"));
    html += meta("Reasoning", esc(task.reasoning_effort || "—"));
    html += meta("Current run", task.current_run_id != null ? task.current_run_id : "—");
    html += meta("Worker pid", task.worker_pid != null ? task.worker_pid : "—");
    html += meta("Last heartbeat", fmtTs(task.last_heartbeat_at));
    html += meta("Created by", esc(task.created_by || "—"));
    html += meta("Tenant", esc(task.tenant || "—"));
    html += meta("Project", esc(task.project_id || "—"));
    html += meta("Idempotency", esc(task.idempotency_key || "—"));
    html += "</div></div></details>";

    if (task.body && task.body.trim()) {
      html += '<details class="collapsed" data-kt-acc="desc"' + accOpen("desc") + '><summary>Description</summary><div class="card"><div class="body">' + esc(task.body) + "</div></div></details>";

      task.diagnostics.forEach(function (d) {
        html += '<div class="diag' + (d.severity === "error" ? " error" : "") + '">' +
          '<div class="dt">' + esc(d.title || d.kind || "Issue") + "</div>" +

        var label = r.status || "—";
        var pc = (r.outcome && r.outcome.toLowerCase().indexOf("crash") >= 0) ? "crashed" : (r.status || "").toLowerCase();
        var running = (r.status === "running");
        html += "<tr><td>" + esc(r.id) + "</td>" +
          "<td><span class='pill " + pc + "'>" + esc(label) + "</span></td>" +

          "<td>" + esc(r.profile || "—") + "</td>" +
          "<td>" + fmtTs(r.started_at) + "</td>" +
          "<td class='run-sum'>" + esc((r.summary || r.error || "").slice(0, 220)) + "</td>" +
          "<td class='nowrap'>" +
            '<button class="btn" data-inspect="' + r.id + '" title="Inspect process">🔍</button> ' +
            (running ? '<button class="btn danger" data-term="' + r.id + '" title="Terminate">✕</button>' : "") +
          "</td></tr>";
      });
      html += "</table></div>";
    } else {
      html += '<div class="card empty">No runs yet.</div>';
    }

    // --- comments ---
    var comments = state.comments || [];
    html += '<div class="section-title">Comments (' + comments.length + ")</div>";
    html += '<div class="card">';
    if (comments.length) {
      comments.forEach(function (c) {
        html += '<div class="comment"><span class="who">' + esc(c.author || "?") +
          "</span><span class='when'>" + fmtTs(c.created_at) + " (" + timeAgo(c.created_at) + ")</span>" +
          '<div class="cbody">' + esc(c.body) + "</div></div>";
      });
    } else {
      html += '<div class="empty">No comments.</div>';
    }
    html += '<div class="commentform">' +
      '<textarea id="kt-comment-input" rows="2" placeholder="Add a comment\u2026"></textarea>' +
      '<button id="kt-comment-btn" type="button">Post</button>' +
      '<span id="kt-comment-msg" class="commentmsg"></span>' +
      "</div></div>";

    // --- events (newest first, lazy-loaded on scroll) ---
    var events = state.events || [];
    var evShown = Math.min(eventsShown, events.length);
    html += '<div class="section-title" id="events-title">Events (' + evShown + ' shown of ' + events.length + ")</div>";
    if (events.length) {
      html += '<div class="card" style="padding:0"><div class="eventbox" id="events-box"></div></div>';
    } else {
      html += '<div class="card empty">No events.</div>';
    }

    document.getElementById("content").innerHTML = html;

    fillLog(true);
    if (editMode) { renderEditForm(); bindEdit(); }
    bindAccordions();
    renderEvents();
    bindEventsScroll();
    bindActions();
    bindAttachments();
    bindHomeChannels();
    bindComments();
  }

  function bindActions() {
    var id = function (x) { return document.getElementById(x); };
    var b = id("kt-act-ready");   if (b) b.addEventListener("click", function () { doStatus("ready", {}); });
    var bl = id("kt-act-block");  if (bl) bl.addEventListener("click", promptBlock);
    var c = id("kt-act-complete"); if (c) c.addEventListener("click", promptComplete);
    var rv = id("kt-act-review"); if (rv) rv.addEventListener("click", function () { doStatus("review", {}); });
    var ar = id("kt-act-archive"); if (ar) ar.addEventListener("click", function () { doStatus("archived", {}); });
    var rc = id("kt-act-reclaim"); if (rc) rc.addEventListener("click", doReclaim);
    var sp = id("kt-act-specify"); if (sp) sp.addEventListener("click", doSpecify);
    var dc = id("kt-act-decompose"); if (dc) dc.addEventListener("click", doDecompose);
    var ed = id("kt-act-edit");   if (ed) ed.addEventListener("click", startEdit);
    var ra = id("kt-act-reassign"); if (ra) ra.addEventListener("click", promptReassign);
    var es = id("kt-act-estimate"); if (es) es.addEventListener("click", doEstimate);
    // run row actions
    document.querySelectorAll("[data-inspect]").forEach(function (el) {
      el.addEventListener("click", function () { doInspectRun(parseInt(el.getAttribute("data-inspect"), 10)); });
    });
    document.querySelectorAll("[data-term]").forEach(function (el) {
      el.addEventListener("click", function () { doTerminateRun(parseInt(el.getAttribute("data-term"), 10)); });
    });
  }

  function bindAttachments() {
    var up = document.getElementById("kt-att-upload");
    var file = document.getElementById("kt-att-file");
    if (up && file) up.addEventListener("click", function () {
      if (file.files && file.files.length) uploadAttachment(file.files[0]);
    });
    document.querySelectorAll(".att-del").forEach(function (el) {
      el.addEventListener("click", function () {
        deleteAttachment(parseInt(el.getAttribute("data-del"), 10), el.getAttribute("data-name") || "");
      });
    });
  }

  function bindHomeChannels() {
    document.querySelectorAll(".home-sub").forEach(function (el) {
      el.addEventListener("click", function () {
        toggleHome(el.getAttribute("data-platform"), el.getAttribute("data-on") === "1");
      });
    });
  }

  function bindComments() {
    var cbtn = document.getElementById("kt-comment-btn");
    var cinput = document.getElementById("kt-comment-input");
    var cmsg = document.getElementById("kt-comment-msg");
    if (!cbtn || !cinput) return;
    function postComment() {
      var body = cinput.value.trim();
      if (!body) return;
      cbtn.disabled = true;
      cmsg.textContent = "Posting\u2026";
      authedFetch(base + "/api/plugins/kanban/tasks/" + encodeURIComponent(taskId) + "/comments" + boardQuery, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ body: body, author: "dashboard" }),
      })
        .then(checkOk)
        .then(function () {
          cinput.value = "";
          cmsg.textContent = "Posted.";
          reload();
        })
        .catch(function (e) { cmsg.textContent = "Error: " + ((e && e.message) || e); })
        .then(function () { cbtn.disabled = false; });
    }
    cbtn.addEventListener("click", postComment);
    cinput.addEventListener("keydown", function (ev) {
      if ((ev.ctrlKey || ev.metaKey) && ev.key === "Enter") postComment();
    });
  }

  function meta(k, v) {
    return '<div><div class="k">' + esc(k) + '</div><div class="v">' + v + "</div></div>";
  }
  function linkChip(id, brd) {
    var url = window.location.pathname + "?task_id=" + encodeURIComponent(id) +
      (brd ? "&board=" + encodeURIComponent(brd) : "");
    return '<a class="chip" href="' + url + '">' + esc(id) + "</a>";
  }
})();
</script>
</body>
</html>
